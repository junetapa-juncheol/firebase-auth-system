<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대시보드 - Firebase Auth System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/auth-styles.css">
</head>
<body class="bg-gradient-to-br from-purple-100 to-pink-200 min-h-screen">
    <!-- 네비게이션 바 -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <i class="fas fa-fire text-purple-600 text-2xl"></i>
                        <span class="ml-2 text-xl font-bold text-gray-800">Firebase Auth</span>
                    </div>
                </div>
                
                <div class="flex items-center space-x-4">
                    <div class="relative">
                        <button id="user-menu-button" class="flex items-center text-sm rounded-full bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
                            <img id="user-avatar" class="h-8 w-8 rounded-full" src="https://ui-avatars.com/api/?name=User&background=6366f1&color=white" alt="User avatar">
                            <span id="user-name-nav" class="ml-2 hidden sm:block">로딩중...</span>
                            <i class="fas fa-chevron-down ml-2"></i>
                        </button>
                        
                        <!-- 드롭다운 메뉴 -->
                        <div id="user-menu" class="hidden origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5">
                            <div class="py-1">
                                <a href="profile.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                    <i class="fas fa-user mr-2"></i>내 프로필
                                </a>
                                <a href="#" id="settings-link" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                    <i class="fas fa-cog mr-2"></i>설정
                                </a>
                                <div class="border-t border-gray-100"></div>
                                <a href="#" id="logout-link" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                    <i class="fas fa-sign-out-alt mr-2"></i>로그아웃
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 메인 콘텐츠 -->
    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- 환영 메시지 -->
        <div class="bg-white rounded-2xl shadow-xl p-8 mb-8">
            <div class="text-center">
                <div class="bg-green-100 w-20 h-20 rounded-full mx-auto mb-6 flex items-center justify-center">
                    <i class="fa-solid fa-circle-check text-green-500 text-4xl"></i>
                </div>
                <h1 class="text-4xl font-bold text-gray-800 mb-4">환영합니다! 🎉</h1>
                <p id="welcome-message" class="text-xl text-gray-600 mb-6">
                    로딩중...
                </p>
                <div class="text-sm text-gray-500">
                    대시보드에 성공적으로 접근했습니다.
                </div>
            </div>
        </div>

        <!-- 대시보드 카드들 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
            <!-- 프로필 카드 -->
            <div class="bg-white rounded-xl shadow-lg p-6 hover:shadow-xl transition duration-300">
                <div class="flex items-center mb-4">
                    <div class="bg-blue-100 p-3 rounded-full">
                        <i class="fas fa-user text-blue-600 text-xl"></i>
                    </div>
                    <h3 class="ml-4 text-lg font-semibold text-gray-800">내 프로필</h3>
                </div>
                <p class="text-gray-600 mb-4">계정 정보를 확인하고 관리하세요.</p>
                <a href="profile.html" 
                   class="inline-flex items-center bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition duration-200">
                    <i class="fas fa-arrow-right mr-2"></i>
                    프로필 보기
                </a>
            </div>

            <!-- 보안 카드 -->
            <div class="bg-white rounded-xl shadow-lg p-6 hover:shadow-xl transition duration-300">
                <div class="flex items-center mb-4">
                    <div class="bg-green-100 p-3 rounded-full">
                        <i class="fas fa-shield-alt text-green-600 text-xl"></i>
                    </div>
                    <h3 class="ml-4 text-lg font-semibold text-gray-800">보안 설정</h3>
                </div>
                <p class="text-gray-600 mb-4">비밀번호 변경 및 보안 옵션을 관리하세요.</p>
                <a href="reset-password.html" 
                   class="inline-flex items-center bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition duration-200">
                    <i class="fas fa-key mr-2"></i>
                    보안 설정
                </a>
            </div>

            <!-- 활동 카드 -->
            <div class="bg-white rounded-xl shadow-lg p-6 hover:shadow-xl transition duration-300">
                <div class="flex items-center mb-4">
                    <div class="bg-purple-100 p-3 rounded-full">
                        <i class="fas fa-chart-line text-purple-600 text-xl"></i>
                    </div>
                    <h3 class="ml-4 text-lg font-semibold text-gray-800">활동 내역</h3>
                </div>
                <p class="text-gray-600 mb-4">최근 로그인 기록과 활동을 확인하세요.</p>
                <button class="inline-flex items-center bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition duration-200">
                    <i class="fas fa-history mr-2"></i>
                    활동 보기
                </button>
            </div>
        </div>

        <!-- 계정 관리 섹션 -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">
                <i class="fas fa-cogs mr-3"></i>계정 관리
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 로그아웃 버튼 -->
                <button
                    id="logout-button"
                    class="flex items-center justify-center bg-gray-600 text-white px-6 py-4 rounded-xl shadow-md hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition duration-200"
                >
                    <i class="fas fa-sign-out-alt mr-3"></i>
                    로그아웃
                </button>

                <!-- 회원탈퇴 버튼 -->
                <button
                    id="delete-account-button"
                    class="flex items-center justify-center bg-red-600 text-white px-6 py-4 rounded-xl shadow-md hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition duration-200"
                >
                    <i class="fas fa-user-times mr-3"></i>
                    회원탈퇴
                </button>
            </div>
        </div>
    </div>

    <!-- 확인 모달 -->
    <div id="confirm-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-6 max-w-sm mx-4">
            <div class="text-center">
                <i id="confirm-icon" class="fas fa-exclamation-triangle text-yellow-500 text-4xl mb-4"></i>
                <h3 id="confirm-title" class="text-lg font-semibold mb-2">확인</h3>
                <p id="confirm-text" class="text-gray-600 mb-6">정말로 실행하시겠습니까?</p>
                <div class="flex space-x-3 justify-center">
                    <button id="confirm-cancel" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-400">취소</button>
                    <button id="confirm-ok" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700">확인</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 메시지 모달 -->
    <div id="message-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-6 max-w-sm mx-4">
            <div class="text-center">
                <i id="message-icon" class="fas fa-check-circle text-green-500 text-4xl mb-4"></i>
                <h3 id="message-title" class="text-lg font-semibold mb-2">성공!</h3>
                <p id="message-text" class="text-gray-600 mb-4">작업이 완료되었습니다.</p>
                <button id="close-message-modal" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">확인</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
