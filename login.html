<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - Firebase Auth System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/auth-styles.css">
</head>
<body class="bg-gradient-to-br from-green-100 to-blue-200 flex items-center justify-center min-h-screen">
    <div class="bg-white shadow-2xl rounded-2xl w-full max-w-md p-8">
        <!-- 헤더 -->
        <div class="text-center mb-8">
            <div class="bg-green-100 w-16 h-16 rounded-full mx-auto mb-4 flex items-center justify-center">
                <i class="fas fa-sign-in-alt text-green-600 text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">로그인</h1>
            <p class="text-gray-600">계정에 로그인하세요</p>
        </div>

        <!-- 로그인 폼 -->
        <form id="login-form" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-envelope mr-2"></i>이메일
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="이메일을 입력하세요"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition duration-200"
                />
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-lock mr-2"></i>비밀번호
                </label>
                <div class="relative">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        placeholder="비밀번호를 입력하세요"
                        class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition duration-200"
                    />
                    <button
                        type="button"
                        id="toggle-password"
                        class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                    >
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- 비밀번호 재설정 링크 -->
            <div class="text-right">
                <a href="reset-password.html" class="text-sm text-green-600 hover:text-green-800">
                    비밀번호를 잊으셨나요?
                </a>
            </div>

            <!-- 로그인 버튼 -->
            <button
                id="login-button"
                type="submit"
                class="w-full bg-green-600 text-white px-4 py-3 rounded-lg font-medium hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition duration-200 flex items-center justify-center"
            >
                <i class="fas fa-sign-in-alt mr-2"></i>
                <span id="login-text">로그인</span>
                <i class="fas fa-spinner fa-spin ml-2 hidden" id="login-loading"></i>
            </button>
        </form>

        <!-- 구분선 -->
        <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-4 bg-white text-gray-500">또는</span>
            </div>
        </div>

        <!-- 소셜 로그인 버튼들 -->
        <div class="space-y-3">
            <button
                id="google-login"
                type="button"
                class="w-full bg-red-500 text-white px-4 py-3 rounded-lg font-medium hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition duration-200 flex items-center justify-center"
            >
                <i class="fab fa-google mr-3"></i>
                Google로 로그인
            </button>

            <button
                id="github-login"
                type="button"
                class="w-full bg-gray-800 text-white px-4 py-3 rounded-lg font-medium hover:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition duration-200 flex items-center justify-center"
            >
                <i class="fab fa-github mr-3"></i>
                GitHub로 로그인
            </button>
        </div>

        <!-- 회원가입 링크 -->
        <div class="mt-8 text-center">
            <p class="text-sm text-gray-600">
                계정이 없으신가요?
                <a href="signup.html" class="text-green-600 hover:text-green-800 font-medium ml-1">회원가입</a>
            </p>
        </div>

        <!-- 데모 계정 정보 -->
        <div class="mt-6 p-4 bg-gray-50 rounded-lg">
            <div class="text-center">
                <p class="text-sm text-gray-600 mb-2">
                    <i class="fas fa-info-circle mr-1"></i>
                    데모 계정으로 테스트해보세요
                </p>
                <button
                    id="demo-login"
                    type="button"
                    class="text-sm text-blue-600 hover:text-blue-800 underline"
                >
                    데모 계정 정보 보기
                </button>
            </div>
        </div>
    </div>

    <!-- 성공/에러 메시지 모달 -->
    <div id="message-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-6 max-w-sm mx-4">
            <div class="text-center">
                <i id="message-icon" class="fas fa-check-circle text-green-500 text-4xl mb-4"></i>
                <h3 id="message-title" class="text-lg font-semibold mb-2">성공!</h3>
                <p id="message-text" class="text-gray-600 mb-4">로그인이 완료되었습니다.</p>
                <button id="close-modal" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700">확인</button>
            </div>
        </div>
    </div>

    <!-- 데모 정보 모달 -->
    <div id="demo-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-6 max-w-sm mx-4">
            <div class="text-center">
                <i class="fas fa-user text-blue-500 text-4xl mb-4"></i>
                <h3 class="text-lg font-semibold mb-4">데모 계정 정보</h3>
                <div class="text-left space-y-2 mb-4">
                    <p class="text-sm"><strong>이메일:</strong> demo@example.com</p>
                    <p class="text-sm"><strong>비밀번호:</strong> demo123</p>
                </div>
                <p class="text-xs text-gray-500 mb-4">
                    또는 Google/GitHub 소셜 로그인을 사용하세요
                </p>
                <button id="close-demo-modal" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">확인</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/login.js"></script>
</body>
</html>
