<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 프로필 - Firebase Auth System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/auth-styles.css">
</head>
<body class="bg-gradient-to-br from-indigo-100 to-purple-200 min-h-screen">
    <!-- 네비게이션 바 -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="dashboard.html" class="flex items-center text-indigo-600 hover:text-indigo-800">
                        <i class="fas fa-arrow-left mr-2"></i>
                        <span class="font-medium">대시보드로 돌아가기</span>
                    </a>
                </div>
                
                <div class="flex items-center">
                    <div class="flex items-center text-sm text-gray-700">
                        <i class="fas fa-fire text-indigo-600 text-xl mr-2"></i>
                        <span class="text-lg font-bold text-gray-800">내 프로필</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 메인 콘텐츠 -->
    <div class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white shadow-2xl rounded-2xl overflow-hidden">
            <!-- 헤더 -->
            <div class="bg-gradient-to-r from-indigo-500 to-purple-600 px-8 py-6">
                <h1 class="text-3xl font-bold text-white flex items-center">
                    <i class="fas fa-user-circle mr-3"></i>
                    내 프로필
                </h1>
                <p class="text-indigo-100 mt-2">계정 정보를 확인하고 관리하세요</p>
            </div>

            <div class="p-8">
                <div class="flex flex-col lg:flex-row gap-8">
                    <!-- 프로필 이미지 섹션 -->
                    <div class="lg:w-1/3 text-center">
                        <div class="relative inline-block">
                            <img id="user-avatar" 
                                 class="w-32 h-32 rounded-full border-4 border-indigo-200 shadow-lg" 
                                 src="https://ui-avatars.com/api/?name=User&background=6366f1&color=white" 
                                 alt="프로필 이미지">
                            <div class="absolute bottom-0 right-0 bg-green-500 w-8 h-8 rounded-full border-4 border-white flex items-center justify-center">
                                <i class="fas fa-check text-white text-sm"></i>
                            </div>
                        </div>
                        <h2 id="user-name" class="text-2xl font-bold text-gray-800 mt-4 mb-2">로딩 중...</h2>
                        <p id="user-email" class="text-gray-600 mb-4">로딩 중...</p>
                        
                        <!-- 인증 상태 배지 -->
                        <div id="verification-badge" class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium">
                            <i class="fas fa-spinner fa-spin mr-2"></i>
                            확인 중...
                        </div>
                    </div>

                    <!-- 계정 정보 섹션 -->
                    <div class="lg:w-2/3">
                        <h3 class="text-xl font-bold text-gray-800 mb-6 flex items-center">
                            <i class="fas fa-info-circle text-indigo-600 mr-2"></i>
                            계정 정보
                        </h3>

                        <div class="space-y-6">
                            <!-- UID -->
                            <div class="bg-gray-50 rounded-lg p-4">
                                <div class="flex items-center mb-2">
                                    <i class="fas fa-fingerprint text-indigo-600 w-6"></i>
                                    <span class="text-sm font-medium text-gray-700 ml-2">사용자 ID (UID)</span>
                                </div>
                                <span id="user-uid" class="text-gray-800 font-mono text-sm bg-white px-3 py-1 rounded border">로딩 중...</span>
                            </div>

                            <!-- 가입일 -->
                            <div class="bg-gray-50 rounded-lg p-4">
                                <div class="flex items-center mb-2">
                                    <i class="fas fa-calendar-alt text-indigo-600 w-6"></i>
                                    <span class="text-sm font-medium text-gray-700 ml-2">가입일</span>
                                </div>
                                <span id="user-created" class="text-gray-800">로딩 중...</span>
                            </div>

                            <!-- 최근 로그인 -->
                            <div class="bg-gray-50 rounded-lg p-4">
                                <div class="flex items-center mb-2">
                                    <i class="fas fa-clock text-indigo-600 w-6"></i>
                                    <span class="text-sm font-medium text-gray-700 ml-2">최근 로그인</span>
                                </div>
                                <span id="user-last-login" class="text-gray-800">로딩 중...</span>
                            </div>

                            <!-- 로그인 방법 -->
                            <div class="bg-gray-50 rounded-lg p-4">
                                <div class="flex items-center mb-2">
                                    <i class="fas fa-key text-indigo-600 w-6"></i>
                                    <span class="text-sm font-medium text-gray-700 ml-2">로그인 방법</span>
                                </div>
                                <div id="provider-info" class="flex flex-wrap gap-2">
                                    <span class="bg-gray-200 px-3 py-1 rounded-full text-sm">로딩 중...</span>
                                </div>
                            </div>

                            <!-- 이메일 인증 상태 -->
                            <div class="bg-gray-50 rounded-lg p-4">
                                <div class="flex items-center mb-2">
                                    <i class="fas fa-envelope-check text-indigo-600 w-6"></i>
                                    <span class="text-sm font-medium text-gray-700 ml-2">이메일 인증</span>
                                </div>
                                <div class="flex items-center justify-between">
                                    <span id="email-verified" class="text-gray-800">로딩 중...</span>
                                    <button id="resend-verification" 
                                            class="hidden bg-indigo-600 text-white px-3 py-1 rounded-md text-sm hover:bg-indigo-700 transition duration-200">
                                        인증 메일 재발송
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- 액션 버튼들 -->
                        <div class="mt-8 flex flex-wrap gap-4">
                            <a href="dashboard.html" 
                               class="bg-indigo-600 text-white px-6 py-3 rounded-lg hover:bg-indigo-700 transition duration-200 flex items-center">
                                <i class="fas fa-tachometer-alt mr-2"></i>
                                대시보드로
                            </a>
                            
                            <a href="reset-password.html" 
                               class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition duration-200 flex items-center">
                                <i class="fas fa-key mr-2"></i>
                                보안 설정
                            </a>
                            
                            <button id="refresh-info" 
                                    class="bg-gray-600 text-white px-6 py-3 rounded-lg hover:bg-gray-700 transition duration-200 flex items-center">
                                <i class="fas fa-sync-alt mr-2"></i>
                                정보 새로고침
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 추가 정보 카드 -->
        <div class="mt-8 grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- 보안 점수 카드 -->
            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="text-center">
                    <div class="bg-green-100 w-16 h-16 rounded-full mx-auto mb-4 flex items-center justify-center">
                        <i class="fas fa-shield-alt text-green-600 text-2xl"></i>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-800 mb-2">보안 점수</h3>
                    <div id="security-score" class="text-3xl font-bold text-green-600">95</div>
                    <p class="text-sm text-gray-600">우수함</p>
                </div>
            </div>

            <!-- 활동 요약 카드 -->
            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="text-center">
                    <div class="bg-blue-100 w-16 h-16 rounded-full mx-auto mb-4 flex items-center justify-center">
                        <i class="fas fa-chart-bar text-blue-600 text-2xl"></i>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-800 mb-2">총 로그인</h3>
                    <div class="text-3xl font-bold text-blue-600">1</div>
                    <p class="text-sm text-gray-600">세션</p>
                </div>
            </div>

            <!-- 계정 나이 카드 -->
            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="text-center">
                    <div class="bg-purple-100 w-16 h-16 rounded-full mx-auto mb-4 flex items-center justify-center">
                        <i class="fas fa-birthday-cake text-purple-600 text-2xl"></i>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-800 mb-2">계정 나이</h3>
                    <div id="account-age" class="text-3xl font-bold text-purple-600">0</div>
                    <p class="text-sm text-gray-600">일</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 메시지 모달 -->
    <div id="message-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-6 max-w-sm mx-4">
            <div class="text-center">
                <i id="message-icon" class="fas fa-check-circle text-green-500 text-4xl mb-4"></i>
                <h3 id="message-title" class="text-lg font-semibold mb-2">성공!</h3>
                <p id="message-text" class="text-gray-600 mb-4">작업이 완료되었습니다.</p>
                <button id="close-message-modal" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700">확인</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/profile.js"></script>
</body>
</html>
