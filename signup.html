<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - Firebase Auth System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/auth-styles.css">
</head>
<body class="bg-gradient-to-br from-blue-100 to-indigo-200 flex items-center justify-center min-h-screen">
    <div class="bg-white shadow-2xl rounded-2xl w-full max-w-md p-8">
        <!-- 헤더 -->
        <div class="text-center mb-8">
            <div class="bg-blue-100 w-16 h-16 rounded-full mx-auto mb-4 flex items-center justify-center">
                <i class="fas fa-user-plus text-blue-600 text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">회원가입</h1>
            <p class="text-gray-600">새 계정을 만들어보세요</p>
        </div>

        <!-- 회원가입 폼 -->
        <form id="signup-form" class="space-y-6">
            <div>
                <label for="displayName" class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-user mr-2"></i>사용자 이름
                </label>
                <input
                    type="text"
                    id="displayName"
                    name="displayName"
                    required
                    placeholder="이름을 입력하세요"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
                />
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-envelope mr-2"></i>이메일
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="이메일을 입력하세요"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
                />
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-lock mr-2"></i>비밀번호
                </label>
                <div class="relative">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        placeholder="비밀번호를 입력하세요"
                        class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
                    />
                    <button
                        type="button"
                        id="toggle-password"
                        class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                    >
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="mt-2 text-xs text-gray-500">
                    비밀번호는 6자리 이상이어야 합니다.
                </div>
            </div>

            <div>
                <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-lock mr-2"></i>비밀번호 확인
                </label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    required
                    placeholder="비밀번호를 다시 입력하세요"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
                />
            </div>

            <!-- 회원가입 버튼 -->
            <button
                id="signup-button"
                type="submit"
                class="w-full bg-blue-600 text-white px-4 py-3 rounded-lg font-medium hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200 flex items-center justify-center"
            >
                <i class="fas fa-user-plus mr-2"></i>
                <span id="signup-text">회원가입</span>
                <i class="fas fa-spinner fa-spin ml-2 hidden" id="signup-loading"></i>
            </button>
        </form>

        <!-- 구분선 -->
        <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-4 bg-white text-gray-500">또는</span>
            </div>
        </div>

        <!-- 소셜 로그인 버튼들 -->
        <div class="space-y-3">
            <button
                id="google-signup"
                type="button"
                class="w-full bg-red-500 text-white px-4 py-3 rounded-lg font-medium hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition duration-200 flex items-center justify-center"
            >
                <i class="fab fa-google mr-3"></i>
                Google로 가입하기
            </button>

            <button
                id="github-signup"
                type="button"
                class="w-full bg-gray-800 text-white px-4 py-3 rounded-lg font-medium hover:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition duration-200 flex items-center justify-center"
            >
                <i class="fab fa-github mr-3"></i>
                GitHub로 가입하기
            </button>
        </div>

        <!-- 로그인 링크 -->
        <div class="mt-8 text-center">
            <p class="text-sm text-gray-600">
                이미 계정이 있으신가요?
                <a href="login.html" class="text-blue-600 hover:text-blue-800 font-medium ml-1">로그인</a>
            </p>
        </div>
    </div>

    <!-- 성공/에러 메시지 모달 -->
    <div id="message-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-6 max-w-sm mx-4">
            <div class="text-center">
                <i id="message-icon" class="fas fa-check-circle text-green-500 text-4xl mb-4"></i>
                <h3 id="message-title" class="text-lg font-semibold mb-2">성공!</h3>
                <p id="message-text" class="text-gray-600 mb-4">회원가입이 완료되었습니다.</p>
                <button id="close-modal" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">확인</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/signup.js"></script>
</body>
</html>
